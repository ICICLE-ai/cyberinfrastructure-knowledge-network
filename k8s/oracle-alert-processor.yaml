apiVersion: apps/v1
kind: Deployment
metadata:
  name: oracle-alert-processor
  namespace: ckn
  labels:
    app: oracle-alert-processor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oracle-alert-processor
  template:
    metadata:
      labels:
        app: oracle-alert-processor
    spec:
      initContainers:
        - name: wait-for-broker
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z broker 29092; do
                echo "Waiting for Kafka broker..."
                sleep 5
              done
              echo "Kafka broker is ready!"
      containers:
        - name: oracle-alert-processor
          image: plalelab/ckn-cameratraps-acc-alert:latest
          env:
            - name: CKN_BROKERS
              value: "broker:29092"
            - name: ORACLE_ACC_CRITICAL_THRESHOLD
              value: "0.5"
            - name: ORACLE_INPUT_TOPIC
              value: "oracle-events"
            - name: ORACLE_ACC_ALERT_TOPIC
              value: "oracle-alerts"
            - name: APP_ID
              value: "ckn-camera-traps-oracle-processor"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
